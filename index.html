<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Learn with Legends</title>
    <meta name="description" content="Interactive legendary story realms, choice-driven chapters, speech feedback, and skill development." />
    <!-- Favicon package from Supabase -->
    <link rel="icon" type="image/x-icon" href="https://fygcrtlqrsjzjocckkhe.supabase.co/storage/v1/object/public/LegPub/favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="https://fygcrtlqrsjzjocckkhe.supabase.co/storage/v1/object/public/LegPub/favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://fygcrtlqrsjzjocckkhe.supabase.co/storage/v1/object/public/LegPub/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://fygcrtlqrsjzjocckkhe.supabase.co/storage/v1/object/public/LegPub/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://fygcrtlqrsjzjocckkhe.supabase.co/storage/v1/object/public/LegPub/favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://fygcrtlqrsjzjocckkhe.supabase.co/storage/v1/object/public/LegPub/favicons/android-chrome-512x512.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Legends" />
    
    <!-- Google Fonts for High-Contrast Luxury & Readable Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0f141c] text-[#e2e8f0] antialiased selection:bg-[#c5a059] selection:text-black">
    <div id="root">
      <!-- Loading state while app bundles and resources load -->
      <div id="app-initial-loader" style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background-color: #0f141c; color: #fce0a2; z-index: 9999; user-select: none;">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;">
          <img
            src="https://fygcrtlqrsjzjocckkhe.supabase.co/storage/v1/object/public/LegPub/favicons/android-chrome-192x192.png"
            alt="Legends"
            style="width: 72px; height: 72px; object-fit: contain; filter: drop-shadow(0 4px 14px rgba(212, 175, 55, 0.45)); animation: emblemPulse 2s ease-in-out infinite;"
          />
          <h1 style="margin-top: 18px; font-family: 'Cinzel', 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 700; letter-spacing: 0.04em; background: linear-gradient(180deg, #f7e098 0%, #e0aa37 38%, #b97c14 72%, #7f4b02 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.7)); margin-bottom: 0;">
            Learn with Legends
          </h1>
          <div style="margin-top: 14px; width: 56px; height: 3px; border-radius: 9999px; background: linear-gradient(90deg, transparent, #d4af37, transparent); animation: barShimmer 1.6s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes emblemPulse {
          0%, 100% { transform: scale(1); opacity: 0.92; }
          50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 6px 20px rgba(212, 175, 55, 0.6)); }
        }
        @keyframes barShimmer {
          0%, 100% { opacity: 0.35; transform: scaleX(0.7); }
          50% { opacity: 1; transform: scaleX(1.3); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
